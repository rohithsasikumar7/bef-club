<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Body Engineers Fit Club - Smart Gym Management & Client Portal</title>
  <meta name="description" content="Mobile-first gym management and client retention portal for Body Engineers Fit Club. Track workouts, personalized diets, and fee due dates seamlessly.">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981', // primary emerald
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              accent: '#00f59b', // neon glow accent
            },
            dark: {
              950: '#06090e',
              900: '#090d16',
              850: '#0d131f',
              800: '#111827',
              750: '#172033',
              700: '#1e293b',
              600: '#334155',
            }
          },
          boxShadow: {
            'glow-emerald': '0 0 25px -5px rgba(16, 185, 129, 0.35)',
            'glow-emerald-lg': '0 0 40px -8px rgba(0, 245, 155, 0.45)',
            'glow-amber': '0 0 25px -5px rgba(245, 158, 11, 0.35)',
            'glow-rose': '0 0 25px -5px rgba(244, 63, 94, 0.4)',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-dark-950 overflow-x-hidden">
  
  <!-- App Shell Container -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Dynamic Header -->
    <header id="main-header" class="sticky top-0 z-40 backdrop-blur-xl bg-dark-950/85 border-b border-slate-800/80 transition-all duration-200">
      <!-- Injected by js/components/Header.js -->
    </header>

    <!-- Global Notification Banner Container -->
    <div id="urgent-alerts-container" class="w-full"></div>

    <!-- Main Content Area with Viewport Simulator Wrapper -->
    <main id="main-content" class="flex-1 flex flex-col w-full relative">
      <!-- Injected dynamically based on active role and view -->
    </main>

    <!-- Global Modal Overlay Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md overflow-y-auto"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-20 right-4 md:bottom-6 md:right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Mobile Bottom Navigation (Visible only in Client Mobile View) -->
    <nav id="mobile-bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-dark-900/95 backdrop-blur-xl border-t border-slate-800/90 py-2 px-4 md:hidden transition-transform duration-300">
      <!-- Injected dynamically -->
    </nav>
  </div>

  <!-- Scripts: Data, Store, Components, App Controller -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
